serviceName: logging-service
component: backend
partOf: ai-trust-game

image:
  repository: ghcr.io/dylar/atg-logging-service
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []

containerPort: 8080
servicePort: 8080

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

config:
  PORT: "8080"
  CLIENT_LOGS_EXCHANGE: client.logs
  CLIENT_LOGS_QUEUE: logging-service.client-logs
  CLIENT_LOGS_ROUTING_KEY: client.log
  CLIENT_LOGS_RETRY_EXCHANGE: client.logs.retry
  CLIENT_LOGS_RETRY_QUEUE: logging-service.client-logs.retry
  CLIENT_LOGS_RETRY_DELAY_MILLIS: "5000"
  CLIENT_LOGS_DEAD_LETTER_EXCHANGE: client.logs.dead-letter
  CLIENT_LOGS_DEAD_LETTER_QUEUE: logging-service.client-logs.dead-letter

secretConfig:
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
