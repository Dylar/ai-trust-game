serviceName: logging-service
namespace: atg-prod
environment: prod
component: backend
partOf: ai-trust-game

replicas: 2

image:
  repository: ghcr.io/dylar/atg-logging-service
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []

containerPort: 8080
servicePort: 8080

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

config:
  APP_ENV: prod
  PORT: "8080"
