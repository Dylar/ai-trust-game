serviceName: game-service
component: backend
partOf: ai-trust-game

image:
  repository: ghcr.io/dylar/atg-game-service
  pullPolicy: IfNotPresent

imagePullSecrets: []

containerPort: 8080
servicePort: 8080

config:
  PORT: "8080"
  LLM_PROVIDER: static
  GROQ_MODEL: ""
  AUDIT_EVENTS_EXCHANGE: audit.events
  AUDIT_EVENTS_ROUTING_KEY: audit.event
  AUDIT_EVENTS_RETRY_EXCHANGE: audit.events.retry
  AUDIT_EVENTS_RETRY_QUEUE: audit-service.audit-events.retry
  AUDIT_EVENTS_RETRY_DELAY_MILLIS: "5000"
  AUDIT_EVENTS_DEAD_LETTER_EXCHANGE: audit.events.dead-letter
  AUDIT_EVENTS_DEAD_LETTER_QUEUE: audit-service.audit-events.dead-letter

secretConfig:
  DATABASE_URL: postgres://ai_trust_game:ai_trust_game@postgres:5432/ai_trust_game?sslmode=disable
  GROQ_API_KEY: ""
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
