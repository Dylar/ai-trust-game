serviceName: game-service
component: backend
partOf: ai-trust-game

image:
  repository: ghcr.io/dylar/atg-game-service
  pullPolicy: IfNotPresent

imagePullSecrets: []

containerPort: 8080
servicePort: 8080

config:
  PORT: "8080"
  LLM_PROVIDER: static
  GROQ_MODEL: ""
  RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
  AUDIT_EVENTS_EXCHANGE: audit.events
  AUDIT_EVENTS_ROUTING_KEY: audit.event
