serviceName: audit-service
namespace: atg-prod
environment: prod
component: backend
partOf: ai-trust-game

replicas: 2

image:
  repository: ghcr.io/dylar/atg-audit-service
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []

containerPort: 8080
servicePort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

config:
  APP_ENV: prod
  PORT: "8080"
  LLM_PROVIDER: static
  GROQ_MODEL: ""
