serviceName: gateway-service
namespace: atg-test
environment: test
component: backend
partOf: ai-trust-game

replicas: 1

image:
  repository: ghcr.io/dylar/atg-gateway-service
  tag: test
  pullPolicy: IfNotPresent

imagePullSecrets: []

containerPort: 8080
servicePort: 8080

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 250m
    memory: 128Mi

config:
  APP_ENV: test
  PORT: "8080"
  GAME_SERVICE_URL: http://game-service:8080
  LOGGING_SERVICE_URL: http://logging-service:8080
  AUDIT_SERVICE_URL: http://audit-service:8080
