serviceName: gateway-service
namespace: atg-dev
environment: dev
component: backend
partOf: ai-trust-game

replicas: 1

image:
  repository: ghcr.io/dylar/atg-gateway-service
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []

containerPort: 8080
servicePort: 8080

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

config:
  APP_ENV: dev
  PORT: "8080"
  GAME_SERVICE_URL: http://game-service:8080
  LOGGING_SERVICE_URL: http://logging-service:8080
  AUDIT_SERVICE_URL: http://audit-service:8080
