serviceName: gateway-service
namespace: atg-prod
environment: prod
component: backend
partOf: ai-trust-game

replicas: 2

image:
  repository: ghcr.io/dylar/atg-gateway-service
  tag: latest
  pullPolicy: IfNotPresent

imagePullSecrets: []

containerPort: 8080
servicePort: 8080

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

config:
  APP_ENV: prod
  PORT: "8080"
  GAME_SERVICE_URL: http://game-service:8080
  LOGGING_SERVICE_URL: http://logging-service:8080
  AUDIT_SERVICE_URL: http://audit-service:8080
