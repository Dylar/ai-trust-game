serviceName: auth-service
component: backend
partOf: ai-trust-game

image:
  repository: ghcr.io/dylar/atg-auth-service
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []

containerPort: 8080
servicePort: 8080

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

config:
  PORT: "8080"

secretConfig:
  DATABASE_URL: postgres://ai_trust_game:ai_trust_game@postgres:5432/ai_trust_game?sslmode=disable
