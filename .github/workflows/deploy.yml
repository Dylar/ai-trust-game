name: Deploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        type: choice
        options:
          - all
          - gateway-service
          - game-service
          - logging-service
          - audit-service
          - frontend-web
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - dev
          - test
          - prod
      image-tag:
        description: "Image tag to deploy, for example a commit SHA or manual-deploy-2026-05-02-11-21"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.service }} To ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v4.1.4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          if [ -z "$KUBE_CONFIG_B64" ]; then
            echo "KUBE_CONFIG_B64 secret is required for deployment." >&2
            exit 1
          fi

          mkdir -p "$HOME/.kube"
          echo "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl config current-context
          kubectl get nodes

      - name: Resolve deployment services
        id: services
        shell: bash
        run: |
          if [ "${{ inputs.service }}" = "all" ]; then
            echo "names=gateway-service game-service logging-service audit-service frontend-web" >> "$GITHUB_OUTPUT"
            echo "deploy-rabbitmq=true" >> "$GITHUB_OUTPUT"
          else
            echo "names=${{ inputs.service }}" >> "$GITHUB_OUTPUT"
            echo "deploy-rabbitmq=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Render RabbitMQ broker
        if: steps.services.outputs.deploy-rabbitmq == 'true'
        shell: bash
        run: |
          helm template rabbitmq ./infrastructure/k8s/rabbitmq-chart \
            -f ./infrastructure/k8s/rabbitmq/values.yaml \
            -f ./infrastructure/k8s/rabbitmq/values-${{ inputs.environment }}.yaml

      - name: Check Kubernetes values
        shell: bash
        run: |
          for service in ${{ steps.services.outputs.names }}; do
            if [ "$service" = "frontend-web" ]; then
              values_file="./apps/trust-game-app/k8s/values-${{ inputs.environment }}.yaml"
            else
              values_file="./services/$service/k8s/values-${{ inputs.environment }}.yaml"
            fi

            if [ ! -f "$values_file" ]; then
              echo "Values file missing for $service: $values_file" >&2
              exit 1
            fi
          done

      - name: Render manifests
        shell: bash
        run: |
          for service in ${{ steps.services.outputs.names }}; do
            if [ "$service" = "frontend-web" ]; then
              base_values_file="./apps/trust-game-app/k8s/values.yaml"
              values_file="./apps/trust-game-app/k8s/values-${{ inputs.environment }}.yaml"
            else
              base_values_file="./services/$service/k8s/values.yaml"
              values_file="./services/$service/k8s/values-${{ inputs.environment }}.yaml"
            fi

            values_args=(-f "$values_file")
            if [ -f "$base_values_file" ]; then
              values_args=(-f "$base_values_file" -f "$values_file")
            fi

            helm template "$service" ./infrastructure/k8s/service-chart \
              "${values_args[@]}" \
              --set image.tag="${{ inputs.image-tag }}"
          done

      - name: Deploy RabbitMQ broker
        if: steps.services.outputs.deploy-rabbitmq == 'true'
        shell: bash
        run: |
          helm upgrade --install rabbitmq ./infrastructure/k8s/rabbitmq-chart \
            -f ./infrastructure/k8s/rabbitmq/values.yaml \
            -f ./infrastructure/k8s/rabbitmq/values-${{ inputs.environment }}.yaml \
            --namespace "atg-${{ inputs.environment }}" \
            --create-namespace

      - name: Deploy release
        shell: bash
        run: |
          for service in ${{ steps.services.outputs.names }}; do
            if [ "$service" = "frontend-web" ]; then
              base_values_file="./apps/trust-game-app/k8s/values.yaml"
              values_file="./apps/trust-game-app/k8s/values-${{ inputs.environment }}.yaml"
            else
              base_values_file="./services/$service/k8s/values.yaml"
              values_file="./services/$service/k8s/values-${{ inputs.environment }}.yaml"
            fi

            values_args=(-f "$values_file")
            if [ -f "$base_values_file" ]; then
              values_args=(-f "$base_values_file" -f "$values_file")
            fi

            helm upgrade --install "$service" ./infrastructure/k8s/service-chart \
              "${values_args[@]}" \
              --set image.tag="${{ inputs.image-tag }}" \
              --namespace "atg-${{ inputs.environment }}" \
              --create-namespace
          done

      - name: Apply app entry
        shell: bash
        run: |
          entry_file="./apps/trust-game-app/k8s/entry-values-${{ inputs.environment }}.yaml"
          if [ -f "$entry_file" ]; then
            helm upgrade --install app-entry ./infrastructure/k8s/entry-chart \
              -f "$entry_file" \
              --namespace "atg-${{ inputs.environment }}" \
              --create-namespace
          else
            echo "No app entry values found for ${{ inputs.environment }}."
          fi
