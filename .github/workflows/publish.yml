name: Publish Images

permissions:
  contents: read
  packages: write

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Optional extra image tag, for example manual-deploy-2026-05-02-11-21"
        required: false
        type: string
        default: ""

jobs:
  go-checks:
    uses: ./.github/workflows/reusable-go.yml

  flutter-checks:
    uses: ./.github/workflows/reusable-flutter.yml
    with:
      flutter-version: "3.41.2"

  helm-checks:
    uses: ./.github/workflows/reusable-helm.yml
    with:
      chart-path: ./infrastructure/k8s/service-chart
      values-files: |
        ./services/gateway-service/k8s/values-dev.yaml
        ./services/gateway-service/k8s/values-test.yaml
        ./services/gateway-service/k8s/values-prod.yaml
        ./services/game-service/k8s/values-dev.yaml
        ./services/game-service/k8s/values-test.yaml
        ./services/game-service/k8s/values-prod.yaml
        ./services/logging-service/k8s/values-dev.yaml
        ./services/logging-service/k8s/values-test.yaml
        ./services/logging-service/k8s/values-prod.yaml
        ./services/audit-service/k8s/values-dev.yaml
        ./services/audit-service/k8s/values-test.yaml
        ./services/audit-service/k8s/values-prod.yaml
        ./apps/trust-game-app/k8s/values-dev.yaml
        ./apps/trust-game-app/k8s/values-test.yaml
        ./apps/trust-game-app/k8s/values-prod.yaml

  helm-entry-checks:
    uses: ./.github/workflows/reusable-helm.yml
    with:
      chart-path: ./infrastructure/k8s/entry-chart
      values-files: |
        ./apps/trust-game-app/k8s/entry-values-dev.yaml
        ./apps/trust-game-app/k8s/entry-values-test.yaml
        ./apps/trust-game-app/k8s/entry-values-prod.yaml

  docker-build-gateway-service:
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      job-name: Docker Build Gateway Service
      dockerfile: ./infrastructure/docker/go-service.Dockerfile
      build-args: |
        SERVICE=gateway-service

  docker-build-game-service:
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      job-name: Docker Build Game Service
      dockerfile: ./infrastructure/docker/go-service.Dockerfile
      build-args: |
        SERVICE=game-service

  docker-build-logging-service:
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      job-name: Docker Build Logging Service
      dockerfile: ./infrastructure/docker/go-service.Dockerfile
      build-args: |
        SERVICE=logging-service

  docker-build-audit-service:
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      job-name: Docker Build Audit Service
      dockerfile: ./infrastructure/docker/go-service.Dockerfile
      build-args: |
        SERVICE=audit-service

  docker-build-frontend-web:
    uses: ./.github/workflows/reusable-docker-build.yml
    with:
      job-name: Docker Build Frontend Web
      dockerfile: ./infrastructure/docker/flutter-web.Dockerfile
      build-args: |
        APP_ENV=dev
        API_BASE_URL=${{ vars.DEV_API_BASE_URL || 'http://raspberrypi.tail164eef.ts.net:30080' }}

  publish-gateway-service:
    needs:
      - go-checks
      - flutter-checks
      - helm-checks
      - helm-entry-checks
      - docker-build-gateway-service
      - docker-build-game-service
      - docker-build-logging-service
      - docker-build-audit-service
      - docker-build-frontend-web
    uses: ./.github/workflows/reusable-docker-publish.yml
    secrets: inherit
    with:
      job-name: Publish Gateway Service To GHCR
      image-name: atg-gateway-service
      dockerfile: ./infrastructure/docker/go-service.Dockerfile
      extra-tags: ${{ github.event.inputs.image-tag || '' }}
      build-args: |
        SERVICE=gateway-service

  publish-game-service:
    needs:
      - go-checks
      - flutter-checks
      - helm-checks
      - helm-entry-checks
      - docker-build-gateway-service
      - docker-build-game-service
      - docker-build-logging-service
      - docker-build-audit-service
      - docker-build-frontend-web
    uses: ./.github/workflows/reusable-docker-publish.yml
    secrets: inherit
    with:
      job-name: Publish Game Service To GHCR
      image-name: atg-game-service
      dockerfile: ./infrastructure/docker/go-service.Dockerfile
      extra-tags: ${{ github.event.inputs.image-tag || '' }}
      build-args: |
        SERVICE=game-service

  publish-logging-service:
    needs:
      - go-checks
      - flutter-checks
      - helm-checks
      - helm-entry-checks
      - docker-build-gateway-service
      - docker-build-game-service
      - docker-build-logging-service
      - docker-build-audit-service
      - docker-build-frontend-web
    uses: ./.github/workflows/reusable-docker-publish.yml
    secrets: inherit
    with:
      job-name: Publish Logging Service To GHCR
      image-name: atg-logging-service
      dockerfile: ./infrastructure/docker/go-service.Dockerfile
      extra-tags: ${{ github.event.inputs.image-tag || '' }}
      build-args: |
        SERVICE=logging-service

  publish-audit-service:
    needs:
      - go-checks
      - flutter-checks
      - helm-checks
      - helm-entry-checks
      - docker-build-gateway-service
      - docker-build-game-service
      - docker-build-logging-service
      - docker-build-audit-service
      - docker-build-frontend-web
    uses: ./.github/workflows/reusable-docker-publish.yml
    secrets: inherit
    with:
      job-name: Publish Audit Service To GHCR
      image-name: atg-audit-service
      dockerfile: ./infrastructure/docker/go-service.Dockerfile
      extra-tags: ${{ github.event.inputs.image-tag || '' }}
      build-args: |
        SERVICE=audit-service

  publish-frontend-web-dev:
    needs:
      - go-checks
      - flutter-checks
      - helm-checks
      - helm-entry-checks
      - docker-build-gateway-service
      - docker-build-game-service
      - docker-build-logging-service
      - docker-build-audit-service
      - docker-build-frontend-web
    uses: ./.github/workflows/reusable-docker-publish.yml
    secrets: inherit
    with:
      job-name: Publish Frontend Web Dev To GHCR
      image-name: atg-frontend-web-dev
      dockerfile: ./infrastructure/docker/flutter-web.Dockerfile
      extra-tags: ${{ github.event.inputs.image-tag || '' }}
      build-args: |
        APP_ENV=dev
        API_BASE_URL=${{ vars.DEV_API_BASE_URL || 'http://raspberrypi.tail164eef.ts.net:30080' }}

  publish-frontend-web-test:
    needs:
      - go-checks
      - flutter-checks
      - helm-checks
      - helm-entry-checks
      - docker-build-gateway-service
      - docker-build-game-service
      - docker-build-logging-service
      - docker-build-audit-service
      - docker-build-frontend-web
    uses: ./.github/workflows/reusable-docker-publish.yml
    secrets: inherit
    with:
      job-name: Publish Frontend Web Test To GHCR
      image-name: atg-frontend-web-test
      dockerfile: ./infrastructure/docker/flutter-web.Dockerfile
      extra-tags: ${{ github.event.inputs.image-tag || '' }}
      build-args: |
        APP_ENV=test
        API_BASE_URL=${{ vars.TEST_API_BASE_URL || 'http://raspberrypi.tail164eef.ts.net:30081' }}

  publish-frontend-web-prod:
    needs:
      - go-checks
      - flutter-checks
      - helm-checks
      - helm-entry-checks
      - docker-build-gateway-service
      - docker-build-game-service
      - docker-build-logging-service
      - docker-build-audit-service
      - docker-build-frontend-web
    uses: ./.github/workflows/reusable-docker-publish.yml
    secrets: inherit
    with:
      job-name: Publish Frontend Web Prod To GHCR
      image-name: atg-frontend-web-prod
      dockerfile: ./infrastructure/docker/flutter-web.Dockerfile
      extra-tags: ${{ github.event.inputs.image-tag || '' }}
      build-args: |
        APP_ENV=prod
        API_BASE_URL=${{ vars.PROD_API_BASE_URL || 'http://raspberrypi.tail164eef.ts.net:30082' }}
