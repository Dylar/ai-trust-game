apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.serviceName }}-config
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.serviceName }}
    app.kubernetes.io/component: {{ .Values.component }}
    app.kubernetes.io/part-of: {{ .Values.partOf }}
    app.kubernetes.io/environment: {{ .Values.environment }}
data:
  default.conf: |
    server {
      listen {{ .Values.containerPort }};

      location = /healthz {
        proxy_pass http://{{ .Values.backend.serviceName }}:{{ .Values.backend.servicePort }};
      }

      location ~ ^/({{ join "|" .Values.backend.routes }})(/|$) {
        proxy_pass http://{{ .Values.backend.serviceName }}:{{ .Values.backend.servicePort }};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        proxy_pass http://{{ .Values.frontend.serviceName }}:{{ .Values.frontend.servicePort }};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
