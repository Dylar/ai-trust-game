serviceName: rabbitmq
component: messaging
partOf: ai-trust-game

replicas: 1

image:
  repository: rabbitmq
  tag: 3-management
  pullPolicy: IfNotPresent

amqpPort: 5672
managementPort: 15672

config:
  allowGuestRemote: true

auth:
  username: guest
  password: guest

persistence:
  enabled: true
  size: 1Gi
  storageClassName: ""

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
