apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Values.serviceName }}-config-map
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: {{ .Values.serviceName }}
    app.kubernetes.io/component: {{ .Values.component }}
    app.kubernetes.io/part-of: {{ .Values.partOf }}
data:
  rabbitmq.conf: |
    listeners.tcp.default = {{ .Values.amqpPort }}
    management.tcp.port = {{ .Values.managementPort }}
    {{- if .Values.config.allowGuestRemote }}
    loopback_users.guest = false
    {{- end }}
