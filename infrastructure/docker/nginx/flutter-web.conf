server {
    # Nginx serves the Flutter web app on the container HTTP port.
    listen 80;
    server_name _;

    # The Dockerfile copies the compiled Flutter web assets into this directory.
    root /usr/share/nginx/html;
    # Serve the Flutter entry document for directory requests.
    index index.html;

    location / {
        # Flutter handles browser routes client-side, so unknown paths fall back to index.html.
        try_files $uri $uri/ /index.html;
    }
}
