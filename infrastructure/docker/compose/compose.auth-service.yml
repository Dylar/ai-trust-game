services:
  auth-service:
    build:
      context: ../../..
      dockerfile: ./infrastructure/docker/go-service.Dockerfile
      args:
        SERVICE: auth-service
    image: auth-service:local
    environment:
      APP_ENV: dev
      PORT: 8080
      DATABASE_URL: postgres://${POSTGRES_USER:-ai_trust_game}:${POSTGRES_PASSWORD:-ai_trust_game}@postgres:5432/${POSTGRES_DB:-ai_trust_game}?sslmode=disable
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
