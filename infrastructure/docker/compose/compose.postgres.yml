services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ai_trust_game}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_trust_game}
      POSTGRES_DB: ${POSTGRES_DB:-ai_trust_game}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres-migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../../infrastructure/persistence/postgres/migrations:/migrations:ro
    command:
      - "-path"
      - "/migrations"
      - "-database"
      - "postgres://${POSTGRES_USER:-ai_trust_game}:${POSTGRES_PASSWORD:-ai_trust_game}@postgres:5432/${POSTGRES_DB:-ai_trust_game}?sslmode=disable"
      - "up"

volumes:
  postgres-data:
