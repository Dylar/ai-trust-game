apiVersion: v1
kind: ConfigMap
metadata:
  name: app-entry-config
  namespace: atg-test
  labels:
    app.kubernetes.io/name: app-entry
    app.kubernetes.io/component: entrypoint
    app.kubernetes.io/part-of: ai-trust-game
    app.kubernetes.io/environment: test
data:
  default.conf: |
    server {
      listen 8080;

      location = /healthz {
        proxy_pass http://main-service:8080;
      }

      location ~ ^/(analysis|chat|interaction|logs|session)(/|$) {
        proxy_pass http://main-service:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        proxy_pass http://frontend-web:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-entry
  namespace: atg-test
  labels:
    app.kubernetes.io/name: app-entry
    app.kubernetes.io/component: entrypoint
    app.kubernetes.io/part-of: ai-trust-game
    app.kubernetes.io/environment: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: app-entry
      app.kubernetes.io/component: entrypoint
  template:
    metadata:
      labels:
        app.kubernetes.io/name: app-entry
        app.kubernetes.io/component: entrypoint
        app.kubernetes.io/part-of: ai-trust-game
        app.kubernetes.io/environment: test
    spec:
      containers:
        - name: app-entry
          image: nginx:1.29-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: nginx-config
          configMap:
            name: app-entry-config
---
apiVersion: v1
kind: Service
metadata:
  name: app-entry
  namespace: atg-test
  labels:
    app.kubernetes.io/name: app-entry
    app.kubernetes.io/component: entrypoint
    app.kubernetes.io/part-of: ai-trust-game
    app.kubernetes.io/environment: test
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: app-entry
    app.kubernetes.io/component: entrypoint
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30081
