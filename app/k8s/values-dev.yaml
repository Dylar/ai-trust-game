serviceName: frontend-web
namespace: atg-dev
environment: dev
component: frontend
partOf: ai-trust-game

replicas: 1

image:
  repository: ghcr.io/dylar/ai-trust-game-frontend-web-dev
  tag: local
  pullPolicy: IfNotPresent

imagePullSecrets: []

containerPort: 80
servicePort: 80

probes:
  readiness:
    path: /
    initialDelaySeconds: 3
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 3

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 250m
    memory: 128Mi

config:
  APP_ENV: dev
